name: Android ROM Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Derleme Ortamını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y bison build-essential ca-certificates curl flex gettext git gnupg gperf htop liblz4-tool libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev python3

      - name: Repo Komutunu Kur
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Git Konfigürasyonunu Ayarla
        run: |
          git config --global user.name "Hamza"
          git config --global user.email "hamza@example.com"

      - name: ROM Kaynak Kodunu İndir ve Derle
        run: |
          mkdir -p android-rom && cd android-rom
          repo init -u https://github.com/LineageOS/android.git -b cm-14.1 --git-lfs
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc)
          
          # Alternatif ve güncel cihaz ağacı çekiliyor
          git clone https://github.com/TheMuppets/proprietary_vendor_samsung.git -b cm-14.1 device/samsung/degaswifie || true
          
          source build/envsetup.sh
          lunch lineage_degaswifie-userdebug || lunch lineage_degaswifie-eng
          mka bacon -j$(nproc)

      - name: ROM Dosyasını Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: custom-rom-zip
          path: |
            *.zip
            android-rom/*.zip
