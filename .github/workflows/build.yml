name: Android ROM Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Derleme Ortamını Hazırla
        run: |
          sudo apt-get update
          sudo apt-get install -y git openjdk-8-jdk wget curl

      - name: Repo Komutunu Kur
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH

      - name: Cihaz Ağacını Hazirla (SM-T230UE)
        run: |
          mkdir -p android-rom/device/samsung/degaswifiue
          echo "SM-T230UE Cihaz Ağacı Hazırlık Klasörü" > android-rom/device/samsung/degaswifiue/README.md

      - name: ROM Kaynak Kodunu İndir ve Derle
        run: |
          git config --global user.name "Hamza"
          git config --global user.email "hamza@actions.com"
          
          mkdir -p android-rom
          cd android-rom
          
          # Test amaçlı dummy çıktı dosyası oluşturuluyor
          echo "SM-T230 LineageOS Altyapısı Başarıyla Kuruldu!" > sm-t230-bilgi.txt

      - name: Çıktıyı Paketle
        uses: actions/upload-artifact@v4
        with:
          name: sm-t230-cikti
          path: android-rom/sm-t230-bilgi.txt
