name: Build Android ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
  steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Set up Environment & Dependencies
      run: |
        sudo apt update && sudo apt install -y curl git repo python2

    - name: Init Repo & Sync
      run: |
        mkdir -p ~/rom
        cd ~/rom
        repo init -u https://github.com/LineageOS/android.git -b cm-14.1
        repo sync -c -j8 --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd ~/rom
        mkdir -p device/samsung
        git clone https://github.com/LineageOS/android_device_samsung_degaswifi.git device/samsung/degaswifi
        git clone https://github.com/LineageOS/android_kernel_samsung_pxa1088.git kernel/samsung/pxa1088

    - name: Start Building
      run: |
        cd ~/rom
        source build/envsetup.sh
        lunch lineage_degaswifi-userdebug
        mka bacon -j8
