name: Android ROM Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Swap Alanını Genişlet
        run: |
          sudo swapoff -a
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Derleme Ortamını Hazırla
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc rsync

      - name: Repo Komutunu Kur
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: ROM Kaynak Kodunu İndir ve Derle
        run: |
          git config --global user.name "Hamza"
          git config --global user.email "hamza@example.com"
          mkdir -p ~/android/rom && cd ~/android/rom
          repo init -u https://github.com/LineageOS/android.git -b cm-14.1 --git-lfs
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc)
          
          # Cihaz ağacını klonla
          mkdir -p device/samsung
          git clone https://github.com/daavvis/device_samsung_degaswifiue.git device/samsung/degaswifi
          
          source build/envsetup.sh
          breakfast lineage_degaswifi-userdebug || breakfast lineage_degaswifi-eng
          mka bacon -j$(nproc)
