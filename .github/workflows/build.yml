name: LineageOS 14.1 Build for SM-T230

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Alanı Temizle ve Arttır
        run: |
          sudo rm -rf /usr/share/dotnet /opt/gh /usr/local/lib/android/sdk
          sudo apt-get clean
          df -h

      - name: Bağımlılıkları Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev libelf-dev libncurses5 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev python3 python-is-python3

      - name: Kaynak Kodları İndir, Manifest Ekle ve Derle
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          
          export PATH=~/bin:$PATH
          
          mkdir -p ~/lineage && cd ~/lineage
          git config --global user.name "Builder"
          git config --global user.email "builder@action.com"
          
          repo init -u https://github.com/LineageOS/android.git -b lineage-14.1
          
          mkdir -p .repo/local_manifests
          echo '<?xml version="1.0" encoding="UTF-8"?><manifest><project name="LineageOS/android_device_samsung_degaswifi" path="device/samsung/degaswifi" remote="github" revision="lineage-14.1" /><project name="LineageOS/android_kernel_samsung_pxa1088" path="kernel/samsung/pxa1088" remote="github" revision="lineage-14.1" /></manifest>' > .repo/local_manifests/roomservice.xml
          
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags --optimized-fetch
          
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch lineage_degaswifi-userdebug
          mka bacon -j8

      - name: Upload ROM Zip
        uses: actions/upload-artifact@v4
        with:
          name: lineage-14.1-SM-T230-Zip
          path: ~/lineage/out/target/product/degaswifi/*.zip
