name: Android 5.1 ROM Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Sistem Gereksinimlerini ve Alanı Temizle
        uses: inner-bottle/ubuntu-core-cleaner@v1.3
        with:
          root-partition: true

      - name: Derleme Ortamını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y bison build-essential ca-certificates curl flex gettext git gnupg gperf htop liblz4-tool libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev python2 python3

      - name: Repo Komutunu Kur
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Git Konfigürasyonunu Ayarla
        run: |
          git config --global user.name "Hamza"
          git config --global user.email "hamza@example.com"

      - name: Android 5.1 Kaynak Kodunu İndir ve Derle
        run: |
          mkdir -p android-rom && cd android-rom
          repo init -u https://github.com/LineageOS/android.git -b cm-12.1 --git-lfs
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc)
          
          # Cihaz ağacını klonluyoruz
          git clone https://github.com/daavvis/device_samsung_degaswifie.git device/samsung/degaswifi
          
          source build/envsetup.sh
          lunch lineage_degaswifi-userdebug || lunch lineage_degaswifi-eng
          mka bacon -j$(nproc)
