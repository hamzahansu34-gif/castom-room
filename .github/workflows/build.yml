name: LineageOS 14.1 Build for SM-T230

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Alanı Temizle ve Arttır
        run: |
          sudo rm -rf /usr/share/dotnet /opt/gh /usr/local/lib/android/sdk
          df -h

      - name: Bağımlılıkları Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev

      - name: Repo Aracını Kur
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Git Yapılandırması
        run: |
          git config --global user.name "Hamza"
          git config --global user.email "hamza@example.com"

      - name: Kaynak Kodları İndir, Manifest Ekler ve Derle
        run: |
          mkdir -p ~/lineage
          cd ~/lineage
          repo init -u https://github.com/LineageOS/android.git -b cm-14.1
          
          mkdir -p .repo/local_manifests
          echo '<?xml version="1.0" encoding="UTF-8"?>' > .repo/local_manifests/roomservice.xml
          echo '<manifest>' >> .repo/local_manifests/roomservice.xml
          echo '  <project name="LineageOS/android_device_samsung_degaswifi" path="device/samsung/degaswifi" remote="github" />' >> .repo/local_manifests/roomservice.xml
          echo '  <project name="LineageOS/android_kernel_samsung_pxa1088" path="kernel/samsung/pxa1088" remote="github" />' >> .repo/local_manifests/roomservice.xml
          echo '  <project name="TheMuppets/proprietary_vendor_samsung_degaswifi" path="vendor/samsung/degaswifi" remote="github" />' >> .repo/local_manifests/roomservice.xml
          echo '</manifest>' >> .repo/local_manifests/roomservice.xml

          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j8

          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch lineage_degaswifi-userdebug
          mka bacon -j8

      - name: Upload ROM Zip
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-SM-T230-ROM
          path: ~/lineage/out/target/product/degaswifi/*.zip
