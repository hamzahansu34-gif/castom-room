name: Android ROM Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Swap Alanını Genişlet
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Derleme Ortamını Hazırla
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip

      - name: Repo Komutunu Kur
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: ROM Kaynak Kodunu İndir ve Derle
        run: |
          git config --global user.name "Hamza"
          git config --global user.email "hamza@example.com"
          mkdir -p ~/android/rom && cd ~/android/rom
          repo init -u https://github.com/LineageOS/android.git -b cm-14.1 --git-lfs
          repo sync -c --no-clone-bundle --optimized-fetch --prune -j4
          
          mkdir -p device/samsung
          git clone https://github.com/daavvis/device_samsung_degaswifie.git device/samsung/degaswifie
          
          source build/envsetup.sh
          breakfast lineage_degaswifie-userdebug || breakfast lineage_degaswifie-eng
          mka bacon -j$(nproc)

      - name: ROM Dosyasını Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: custom-rom-zip
          path: |
            /home/runner/android/rom/out/target/product/**/*.zip
            *.zip
