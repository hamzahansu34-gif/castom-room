name: Android 7.1.1 Build (SM-T230)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 12288
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc rsync

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Git
        run: |
          git config --global user.name "Hamza"
          git config --global user.email "hamza@example.com"

      - name: Initialize LineageOS 14.1 Manifest
        run: |
          mkdir -p ~/android/lineage && cd ~/android/lineage
          repo init -u https://github.com/LineageOS/android.git -b cm-14.1 --git-lfs

      - name: Sync Source (Optimized for Speed)
        run: |
          cd ~/android/lineage
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Cihaz Agacini Klonla
        run: |
          cd ~/android/lineage
          mkdir -p device/samsung
          git clone https://github.com/simonelomu/SM-T230NU-Degaswifi-LineageOS-14.1.git device/samsung/degaswifi

      - name: Test Completion Check
        run: echo "Hazırlık ve klonlama tamamlandı!"
