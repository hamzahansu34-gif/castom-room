name: T230 Custom Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ROM
    runs-on: ubuntu-latest
    
    steps:
    - name: Check Out Repository
      uses: actions/checkout@v2

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: false

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git repo curl g++-multilib gcc-multilib lib32ncurses-dev lib32z1-dev flex bison gperf build-essential zip zlib1g-dev libc6-dev-i386 libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc || true

    - name: Setup Git Configuration
      run: |
        git config --global user.name "Hamza"
        git config --global user.email "hamza@example.com"

    - name: Fetch CyanogenMod 11 Source
      run: |
        mkdir -p ~/cm11
        cd ~/cm11
        repo init -u https://github.com/CyanogenMod/android.git -b cm-11.0 --depth=1
        repo sync -c -j8 --force-sync --no-clone-bundle --no-tags

    - name: Download Device Tree & Kernel
      run: |
        cd ~/cm11
        mkdir -p device/samsung
        git clone https://github.com/LineageOS/android_device_samsung_degaswifi.git -b cm-11.0 device/samsung/degaswifi --depth=1 || git clone https://github.com/LineageOS/android_device_samsung_degaswifi.git device/samsung/degaswifi --depth=1

    - name: Compile ROM
      run: |
        cd ~/cm11
        source build/envsetup.sh
        lunch cm_degaswifi-userdebug
        mka bacon -j8
