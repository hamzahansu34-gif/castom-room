name: Android ROM Yapısı

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Depoyu Klonla ve Hazırlık Yap
        uses: actions/checkout@v4

      - name: Sistem Gereksinimlerini ve Paketleri Yükle
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev

      - name: Repo Aracını Kur
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH

      - name: Git Kimlik Ayarla
        run: |
          git config --global user.name "Hamza"
          git config --global user.email "hamza@example.com"

      - name: LineageOS 14.1 Kaynak Kodunu İndir
        run: |
          export PATH=~/bin:$PATH
          mkdir -p ~/lineage
          cd ~/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-14.1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j4

      - name: Cihaz Ağacını Ekle
        run: |
          cd ~/lineage
          mkdir -p device/samsung/degaswifi
          git clone --depth 1 https://github.com/LineageOS/android_device_samsung_degaswifi.git device/samsung/degaswifi

      - name: ROM Derlemesini Başlat
        run: |
          cd ~/lineage
          export PATH=~/bin:$PATH
          source build/envsetup.sh
          breakfast lineage_degaswifi-userdebug
          mka bacon -j4
