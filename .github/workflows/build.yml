name: Android ROM Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Derleme Ortamını Hazırla
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip

      - name: Repo Komutunu Kur
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Cihaz Ağacını Hazırla (SM-T230)
        run: |
          mkdir -p android-rom/device/samsung/degaswifi
          git clone https://github.com/daavvis/device_samsung_degaswifiue.git android-rom/device/samsung/degaswifi

      - name: ROM Dosyasını Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: custom-rom-zip
          path: |
            *.zip
            android-rom/*.zip
