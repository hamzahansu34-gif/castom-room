name: LineageOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Alanı Temizle ve Arttır
        run: |
          sudo rm -rf /usr/share/dotnet /opt/gh /usr/local/lib/android/sdk
          sudo apt-get clean
          df -h

      - name: Bağımlılıkları Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev libelf-dev libncurses5 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev python3 python-is-python3

      - name: Kaynak Kodları İndir ve Repo Kurulumu
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          
          export PATH=~/bin:$PATH
          
          mkdir lineage && cd lineage
          git config --global user.name "Builder"
          git config --global user.email "builder@action.com"
          repo init -u https://github.com/LineageOS/android.git -b cm-14.1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j8

      - name: Cihaz Ağacını Çek ve Derlemeyi Başlat
        run: |
          cd lineage
          
          # Doğru local_manifests kullanarak cihaz dosyalarını otomatik ve hatasız çekiyoruz
          mkdir -p .repo/local_manifests
          echo '<?xml version="1.0" encoding="UTF-8"?>' > .repo/local_manifests/roomservice.xml
          echo '<manifest>' >> .repo/local_manifests/roomservice.xml
          echo '  <project name="LineageOS/android_device_samsung_degaswifi" path="device/samsung/degaswifi" remote="github" revision="cm-14.1" />' >> .repo/local_manifests/roomservice.xml
          echo '</manifest>' >> .repo/local_manifests/roomservice.xml
          
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j8
          
          source build/envsetup.sh
          brunch degaswifi
